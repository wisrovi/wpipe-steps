[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wpipe-steps"
version = "0.3.0"
authors = [
    { name = "William Steve Rodriguez Villamizar", email = "wisrovi.rodriguez@gmail.com" }
]
description = "A professional collection of pre-built steps and states for the WPipe orchestration engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "wpipe",
    "pipeline",
    "automation",
    "workflow-steps",
    "data-processing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "wpipe>=2.3.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/wisrovi/wpipe-steps"
Repository = "https://github.com/wisrovi/wpipe-steps"
Issues = "https://github.com/wisrovi/wpipe-steps/issues"

[tool.hatch.build.targets.wheel]
packages = ["wpipe_steps"]
