[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wpipe-steps"
version = "0.25.0"
authors = [
    { name = "William Steve Rodriguez Villamizar", email = "wisrovi.rodriguez@gmail.com" }
]
description = "A professional collection of pre-built steps and states for the WPipe orchestration engine. Lightweight and modular."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["wpipe", "pipeline", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
# Only CORE dependencies here
dependencies = [
    "wpipe>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "black>=23.0.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/wisrovi/wpipe-steps"
Repository = "https://github.com/wisrovi/wpipe-steps"

[tool.hatch.build.targets.wheel]
packages = ["wpipe_steps"]
